<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>상관없어 팝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one poster, scaled to fit the screen, centred on its own cream ground */
:root{--ground:#EFE2CB;--paper:#F7EEDA;--ink:#7A1406;--hint:#9A3A1E;--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hp-frame{position:relative;flex:0 0 auto;max-width:100%;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(122,20,6,.18)}
.hp-stage{position:absolute;left:0;top:0;width:600px;height:848px;overflow:hidden;background:var(--paper);transform-origin:0 0}
.hp-hint{margin:0;font-size:13px;letter-spacing:.06em;color:var(--hint);text-align:center}
.hp-hit{touch-action:manipulation}
.hp-img{-webkit-touch-callout:none}

.hp-img{position:absolute;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.hp-mouth{transform-origin:50% 50%;animation:hp-breathe 2.8s ease-in-out infinite alternate}
.hp-mouth.inhale{animation:hp-inhale 230ms ease-in both}
.hp-mouth.talk{animation:hp-talk var(--st, 260ms) ease-in-out 0ms 4 both}
.hp-mouth.settle{animation:hp-settle 320ms cubic-bezier(.34,1.56,.64,1) both}
.hp-mouth.gulp{animation:hp-gulp 520ms ease-out both}
.hp-syl{transform-origin:50% 50%;will-change:transform,opacity}
.hp-syl.suck{animation:hp-suck 220ms ease-in both}
.hp-syl.talk{animation:hp-emerge var(--dur, 1400ms) linear calc(var(--i) * var(--st, 260ms)) both}
.hp-syl.gone{opacity:0}
.hp-syl.back{animation:hp-back 560ms cubic-bezier(.34,1.56,.64,1) calc(var(--i) * 60ms) both}
.hp-hit{position:absolute;z-index:10;padding:0;margin:0;border:0;background:transparent;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hp-hit:focus-visible{outline:3px solid #7A1406;outline-offset:4px}
.hp-cf{position:absolute;width:0;height:0;animation:hp-cfx var(--d) cubic-bezier(.12,.7,.3,1) var(--dl) both}
.hp-cf>span{position:absolute;left:0;top:0;display:block;animation:hp-cfy var(--d) linear var(--dl) both}
.hp-cf>span>i{position:absolute;left:0;top:0;display:block;animation:hp-cfr var(--d) ease-out var(--dl) both}
@keyframes hp-breathe{from{transform:scale(1)}to{transform:scale(1.015)}}
@keyframes hp-gulp{0%{transform:scale(1)}45%{transform:scale(1.05,.9)}100%{transform:scale(1)}}
@keyframes hp-inhale{0%{transform:scale(1)}100%{transform:scale(.9,.82)}}
@keyframes hp-talk{0%{transform:scale(.9,.82)}45%{transform:scale(1.1,1.22)}100%{transform:scale(.9,.82)}}
@keyframes hp-settle{0%{transform:scale(.9,.82)}100%{transform:scale(1)}}
@keyframes hp-suck{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--ox),var(--oy)) scale(0);opacity:0}}
@keyframes hp-emerge{
0%{transform:translate(var(--ox),var(--oy)) scale(0) rotate(0deg);opacity:0;filter:brightness(1);animation-timing-function:cubic-bezier(.2,.9,.35,1)}
6%{opacity:1}
55%{transform:translate(var(--dx),var(--dy)) scale(var(--s)) rotate(var(--r));animation-timing-function:linear}
80%{transform:translate(var(--dx),var(--dy)) scale(calc(var(--s) * 1.22)) rotate(var(--r));opacity:1;filter:brightness(1.1);animation-timing-function:ease-in}
88%{transform:translate(var(--dx),var(--dy)) scale(calc(var(--s) * 1.6)) rotate(var(--r));opacity:0;filter:brightness(1.6)}
100%{transform:translate(var(--dx),var(--dy)) scale(calc(var(--s) * 1.6)) rotate(var(--r));opacity:0}
}
@keyframes hp-back{0%{transform:scale(0);opacity:0}50%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes hp-cfx{from{transform:translateX(0)}to{transform:translateX(var(--vx))}}
@keyframes hp-cfy{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.75,.45,1)}30%{transform:translateY(var(--up));animation-timing-function:cubic-bezier(.55,0,.85,.55)}100%{transform:translateY(var(--fall))}}
@keyframes hp-cfr{0%{transform:translate(-50%,-50%) scale(.2) rotate(0deg) rotateX(0deg);opacity:1}12%{transform:translate(-50%,-50%) scale(1) rotate(calc(var(--rot) * .15)) rotateX(calc(var(--fl) * .15));opacity:1}75%{opacity:1}100%{transform:translate(-50%,-50%) scale(.9) rotate(var(--rot)) rotateX(var(--fl));opacity:0}}
@media (prefers-reduced-motion: reduce){.hp-mouth{animation:none}}

</style>

<script>
(function(){
  var W=600,H=848, frame=document.getElementById('hp-frame'), stage=document.getElementById('hp-stage'), hint=document.querySelector('.hp-hint');
  function fit(){
    var cs=getComputedStyle(document.body);
    var aw=document.body.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    var ah=document.body.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-hint.offsetHeight-10;
    var k=Math.max(0.2,Math.min(aw/W,ah/H));
    frame.style.width=(W*k)+'px'; frame.style.height=(H*k)+'px'; stage.style.transform='scale('+k+')';
  }
  window.addEventListener('resize',fit); window.addEventListener('orientationchange',fit); fit();

  var SYL={
      1: [[51.25, 382, -21, -112], [110.75, 383.25, 19, -163], [191.5, 387.5, 63.5, -170], [247, 390.25, 98, -110]],
      2: [[58, 520, 62, -50], [123.5, 515.5, 112, -60], [59.75, 590, 80, -15], [126.25, 593.25, 125, -33]],
      3: [[384.5, 622, -0.1, -11.9], [380.5, 654.5, -2.1, 4.4], [384, 702.5, -0.4, 20], [373.25, 761, -4, 30]]
    };
  var ST={1:260,2:260,3:330}, DUR={1:1400,2:1400,3:1250};
  var COLORS=['#F2452B','#E8701A','#FFB7A6','#FFF1DC','#7A1406','#FFC531','#F2452B','#FFB7A6'];
  var cfHost=document.getElementById('hp-cf'), busy={};
  function R(a,b){return a+Math.random()*(b-a);}
  function setMouth(m,c){document.getElementById('hp-m'+m).className='hp-img hp-mouth'+(c?' '+c:'');}
  function setSyl(m,c){var els=document.querySelectorAll('.hp-s'+m);for(var i=0;i<els.length;i++)els[i].className='hp-img hp-syl hp-s'+m+(c?' '+c:'');}
  function confetti(m){
    var list=SYL[m], made=[];
    for(var i=0;i<list.length;i++){
      var cx=list[i][0]+list[i][2], cy=list[i][1]+list[i][3];
      for(var k=0;k<24;k++){
        var kind=Math.random(),w,h,rad;
        if(kind<.45){w=R(6,10);h=R(14,24);rad='2px';} else if(kind<.7){w=4;h=R(26,38);rad='2px';} else if(kind<.88){w=9;h=9;rad='50%';} else {w=8;h=8;rad='1px';}
        var d=Math.round(R(1100,1800)), dl=i*ST[m]+Math.round(R(0,60));
        var o=document.createElement('div'); o.className='hp-cf';
        o.style.cssText='left:'+cx+'px;top:'+cy+'px;--vx:'+R(-170,170).toFixed(0)+'px;--up:'+R(-150,-40).toFixed(0)+'px;--fall:'+R(140,320).toFixed(0)+'px;--d:'+d+'ms;--dl:'+dl+'ms';
        var s=document.createElement('span'), p=document.createElement('i');
        p.style.cssText='width:'+w.toFixed(1)+'px;height:'+h.toFixed(1)+'px;border-radius:'+rad+';background:'+COLORS[Math.floor(Math.random()*COLORS.length)]+';--rot:'+R(-720,720).toFixed(0)+'deg;--fl:'+R(180,900).toFixed(0)+'deg';
        s.appendChild(p); o.appendChild(s); cfHost.appendChild(o); made.push(o);
      }
    }
    return made;
  }
  function fire(m){
    if(busy[m]) return; busy[m]=true;
    var st=ST[m], dur=DUR[m], bits=[];
    setSyl(m,'suck'); setMouth(m,'inhale');
    setTimeout(function(){setSyl(m,'talk'); setMouth(m,'talk');},230);
    setTimeout(function(){setMouth(m,'settle');},230+4*st);
    setTimeout(function(){bits=confetti(m);},230+Math.round(.86*dur));
    setTimeout(function(){bits.forEach(function(b){b.remove();}); setSyl(m,'back'); setMouth(m,'gulp');},3800);
    setTimeout(function(){setSyl(m,''); setMouth(m,''); busy[m]=false;},4450);
  }
  var hits=document.querySelectorAll('.hp-hit');
  for(var i=0;i<hits.length;i++) hits[i].addEventListener('click',function(e){fire(+e.currentTarget.getAttribute('data-mouth'));});
})();
</script>
