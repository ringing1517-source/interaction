<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>상관없이 撕与缝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one poster on a dark wall; a slim control strip under it. Deliberately single (dark) theme. */
:root {
  --wall: #141413;          /* the wall the poster hangs on */
  --wall-2: #1d1c1a;
  --ink: #ece8e0;           /* text on the wall */
  --muted: #9a958c;
  --accent: #b3261e;        /* grip handle / close button */
  --focus: #e9c46a;
  --display: "Black Han Sans", "Noto Sans SC", system-ui, sans-serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: grab; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--wall-2), var(--wall) 70%);
  background-color: var(--wall);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage {
  min-height: 100%;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 18px;
  padding-block: 20px 28px;
}
.poster {
  position: relative;
  height: min(78vh, 1080px);
  aspect-ratio: 2 / 3;
  max-width: 100%;
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7), 0 4px 14px rgba(0, 0, 0, .45);
  touch-action: none;
  overscroll-behavior: contain;
  -webkit-touch-callout: none;
  cursor: inherit;
  user-select: none;
  -webkit-user-select: none;
}
.poster.dragging { cursor: inherit; }
.poster canvas { display: block; width: 100%; height: 100%; }
.poster:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }
.loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 13px; letter-spacing: .08em; color: var(--muted); background: #1e1e1e;
}
.bar {
  width: min(100%, calc(min(78vh, 1080px) * 2 / 3));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
}
.name { font-family: var(--display); font-size: 22px; letter-spacing: .02em; line-height: 1; }
.hint { flex: 1 1 220px; min-width: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.meter { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 64px; text-align: right; }
.btns { display: flex; gap: 8px; }
button {
  font: 500 14px/1 var(--body);
  color: var(--ink);
  background: transparent;
  border: 1px solid #4a4743;
  border-radius: 2px;
  padding: 10px 16px;
  min-height: 40px;
  cursor: pointer;
  touch-action: manipulation;
}
button:hover { border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button.sew { border-color: var(--accent); }
button.sew:hover { background: var(--accent); }
@media (max-width: 480px) {
  /* phone: the poster and the controls fit one screen, no scrolling */
  .stage { gap: 12px; padding-block: 12px 14px; min-height: 100svh; }
  .poster { height: auto; width: min(100%, calc((100svh - 150px) * 2 / 3)); }
  .bar { width: min(100%, calc((100svh - 150px) * 2 / 3)); gap: 6px 10px; }
  .name { font-size: 18px; }
  .hint { flex-basis: 100%; order: 3; font-size: 12px; margin: 0; }
  .meter { margin-left: auto; }
  .btns { order: 2; }
  button { padding: 9px 12px; font-size: 13px; }
}
</style>

<main class="stage">
  <div class="poster" id="poster" tabindex="0" role="img"
       aria-label="海报《상관없이》：在屏幕任意位置滑动让纸变皱，抚平按钮恢复平整；顺着撕口和裂纹从右往左滑动撕开，从左往右滑动合上。键盘可用左右方向键。">
    <canvas id="cv"></canvas>
    <div class="loading" id="loading">纸张载入中…</div>
  </div>
  <div class="bar">
    <span class="name">상관없이</span>
    <p class="hint" id="hint">在屏幕任意位置朝任意方向滑动，纸会越来越皱，点「抚平」恢复平整。从撕口或裂纹上按下再滑：从右往左撕开，从左往右合上。</p>
    <span class="meter" id="meter" aria-live="polite">完好</span>
    <div class="btns">
      <button type="button" id="btnTear">一把撕开</button>
      <button type="button" id="btnSew" class="sew">合上</button>
      <button type="button" id="btnFlat">抚平</button>
    </div>
  </div>
</main>

<script>

  const K = META.count, TIPS = META.tips, SEAM = META.seam;
  const poster = document.getElementById('poster');
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const meter = document.getElementById('meter');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // index where the tear tip has left the sheet; after that the pieces finish opening on their own
  let K_END = TIPS.findIndex(t => t <= -0.02); if (K_END < 0) K_END = K - 1;

  // ---- frames ----
  const imgs = new Array(K); let loaded = 0;
  for (let k = 0; k < K; k++) {
    const im = new Image();
    im.onload = () => { if (++loaded === K) { document.getElementById('loading').hidden = true; draw(); } };
    im.src = 'frames/f' + String(k).padStart(2, '0') + '.webp';
    imgs[k] = im;
  }

  // ---- geometry helpers ----
  function tipAt(p) {                       // tear tip (0..1 of width) at a fractional frame index
    const i = Math.max(0, Math.min(K - 2, Math.floor(p))), f = Math.min(1, Math.max(0, p - i));
    return TIPS[i] * (1 - f) + TIPS[i + 1] * f;
  }
  function indexForTip(u) {                 // frame whose tip sits under the pointer
    if (u >= 0.96) return 0;                // at the right edge: fully closed
    if (u <= 0.03) return K - 1;            // past the left edge: the tear runs out and opens fully
    for (let k = 0; k < K_END; k++) {
      if (TIPS[k] >= u && u > TIPS[k + 1]) return k + (TIPS[k] - u) / (TIPS[k] - TIPS[k + 1]);
    }
    return K_END;
  }
  function seamY(x) {
    for (let i = 0; i < SEAM.length - 1; i++) {
      const a = SEAM[i], b = SEAM[i + 1];
      if (x <= b[0]) { const t = (x - a[0]) / (b[0] - a[0] || 1); return a[1] + (b[1] - a[1]) * t; }
    }
    return SEAM[SEAM.length - 1][1];
  }

  // ---- spring-driven state (fast, decisive, no wobble) ----
  let pos = 0, vel = 0, target = 0, last = performance.now(), running = false;
  function step(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (reduce) { pos = target; vel = 0; }
    else {
      const w0 = 22;                                  // critically damped spring
      const acc = w0 * w0 * (target - pos) - 2 * w0 * vel;
      vel += acc * dt; pos += vel * dt;
    }
    pos = Math.max(0, Math.min(K - 1, pos));
    draw();
    const settled = Math.abs(target - pos) < 0.01 && Math.abs(vel) < 0.01;
    if (!settled) requestAnimationFrame(step); else { pos = target; running = false; draw(); }
  }
  function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); } }
  function setTarget(t) { target = Math.max(0, Math.min(K - 1, t)); kick(); }

  // ---- drawing ----
  function resize() {
    const r = poster.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); draw();
  }
  // ---- crumpling ----
  // Swiping in any direction crumples the sheet; the 抚平 button flattens it.
  // Each "crease event" is centred on the swipe and spreads around it; its direction, length, kinks, ridge or
  // valley, depth and the distance to the next one are random.
  // The creases live on their own canvas (50 % grey = flat), laid over the poster in Hard Light.
  const WW = 720, WH = 1080;
  const PAPER = { l: 93 / 4000, t: 137 / 6000, r: 1 - 100 / 4000, b: 1 - 97 / 6000 };   // inside the black frame
  const PX0 = WW * PAPER.l, PX1 = WW * PAPER.r, PY0 = WH * PAPER.t, PY1 = WH * PAPER.b;
  const wc = document.createElement('canvas'); wc.width = WW; wc.height = WH;
  const wx = wc.getContext('2d');
  const LIGHT = Math.atan2(-0.65, -0.55);           // light from the upper left, like the poster's torn edges
  const MAX_CREASES = 900, CHECK = 80;              // checkpoints keep smoothing back cheap
  let creases = [], drawn = 0, checkpoints = [];
  function blank() { wx.globalCompositeOperation = 'source-over'; wx.fillStyle = 'rgb(128,128,128)'; wx.fillRect(0, 0, WW, WH); }
  function flatten() { creases = []; drawn = 0; checkpoints = []; travel = 0; nextAt = 10; blank(); }
  blank();
  const rnd = (a, b) => a + Math.random() * (b - a);
  function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
  function powLen(a, b, k) { return a + (b - a) * Math.pow(Math.random(), k); }   // mostly short, now and then long
  // a kinked line: starts at (x, y), heads along ang, turns a little at each kink
  function polyline(x, y, ang, len, kinks, wobble) {
    const pts = [[x, y]], n = kinks + 1;
    let a = ang;
    for (let i = 0; i < n; i++) {
      const l = len / n * rnd(0.6, 1.4);
      x += Math.cos(a) * l; y += Math.sin(a) * l; pts.push([x, y]);
      a += gauss() * wobble;
    }
    return pts;
  }
  // taper: strongest at its start (the contact point), dying out toward its far end; otherwise both ends fade
  function line(pts, depth, w, taper) {
    return { pts, depth, w, taper: !!taper, ridge: Math.random() < 0.5 ? 1 : -1 };   // ridge or valley: which side catches the light
  }
  // Paper pushed at one point buckles around it: folds run outward from the contact point and weaken with
  // distance, and the sheet around it gives way in smaller creases that lie roughly across those folds.
  // So every crease event is centred on the swipe, but its creases reach well beyond it (up to ~1/2 the sheet
  // width for the long folds), deepest at the finger and fading toward their far ends.
  function makeCrease(u, v, swipeDir, n) {
    const depth = Math.min(1, rnd(0.3, 0.55) + n * 0.0015) * rnd(0.6, 1.15);
    const fx = u * WW, fy = v * WH;
    const cl = (x, y) => [Math.min(PX1, Math.max(PX0, x)), Math.min(PY1, Math.max(PY0, y))];
    const contact = () => cl(fx + gauss() * 22, fy + gauss() * 22);
    const outward = () => Math.random() < 0.35 ? swipeDir + gauss() * 0.7 : Math.random() * Math.PI * 2;   // pushed paper folds ahead of the finger more often
    const r = Math.random(), lines = [];
    if (r < 0.32) {                                     // a fold running out from the contact point
      const [x, y] = contact(), len = powLen(90, 380, 1.5);
      lines.push(line(polyline(x, y, outward(), len, Math.floor(rnd(1, 5)), 0.3), depth, rnd(5, 9) + len * 0.035, true));
    } else if (r < 0.52) {                              // a buckle: 3-6 folds spreading from one point
      const [x, y] = contact(), k = 3 + Math.floor(Math.random() * 4);
      let a = Math.random() * Math.PI * 2;
      for (let i = 0; i < k; i++) {
        a += (Math.PI * 2 / k) * rnd(0.5, 1.5);
        const len = powLen(40, 220, 1.6);
        lines.push(line(polyline(x, y, a, len, Math.floor(rnd(0, 3)), 0.35), depth * rnd(0.5, 0.9), rnd(4, 7) + len * 0.04, true));
      }
    } else if (r < 0.85) {                              // the ring around it giving way: creases lying across the folds
      const ra = Math.random() * Math.PI * 2, dist = 30 + Math.abs(gauss()) * 170;
      const [x, y] = cl(fx + Math.cos(ra) * dist, fy + Math.sin(ra) * dist);
      const a = ra + Math.PI / 2 + gauss() * 0.6, len = powLen(30, 170, 1.5);
      lines.push(line(polyline(x - Math.cos(a) * len / 2, y - Math.sin(a) * len / 2, a, len, Math.floor(rnd(0, 3)), 0.4),
                      depth * rnd(0.45, 0.85) * Math.exp(-dist / 220), rnd(3, 6) + len * 0.04, false));
    } else {                                            // a small sharp crease right under the finger
      const [x, y] = contact(), a = Math.random() * Math.PI * 2, len = powLen(15, 70, 2);
      lines.push(line(polyline(x - Math.cos(a) * len / 2, y - Math.sin(a) * len / 2, a, len, Math.floor(rnd(0, 2)), 0.5), depth * rnd(0.6, 1), rnd(3, 5), false));
    }
    return lines;
  }
  // paint one line: crease, shadow on the side turned from the light, narrower highlight on the side facing it,
  // everything fading toward both ends
  function paintLine(L) {
    const P = L.pts; let total = 0; const segLen = [];
    for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); segLen.push(l); total += l; }
    let run = 0;
    for (let i = 1; i < P.length; i++) {
      const [x0, y0] = P[i - 1], [x1, y1] = P[i], sl = segLen[i - 1], ang = Math.atan2(y1 - y0, x1 - x0);
      const facing = (Math.cos(ang + Math.PI / 2 - LIGHT) > 0 ? 1 : -1) * L.ridge;
      const wS = L.taper ? L.w * (1 - 0.6 * (run + sl / 2) / total) : L.w, wL = wS * 0.55, steps = Math.max(2, Math.round(sl / 16));
      wx.save(); wx.translate(x0, y0); wx.rotate(ang);
      for (let s = 0; s < steps; s++) {
        const a0 = s / steps * sl, a1 = (s + 1) / steps * sl + 0.6;
        const tm = (run + (a0 + a1) / 2) / total, a = L.depth * (L.taper ? Math.min(1, tm * 8) * (1 - tm) ** 1.3 : Math.sin(Math.PI * tm) ** 0.8);
        let g = wx.createLinearGradient(0, 0, 0, -facing * wS);
        g.addColorStop(0, 'rgba(0,0,0,' + (0.55 * a) + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
        wx.fillStyle = g; wx.fillRect(a0, facing > 0 ? -wS : 0, a1 - a0, wS);
        g = wx.createLinearGradient(0, 0, 0, facing * wL);
        g.addColorStop(0, 'rgba(255,255,255,' + (0.42 * a) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
        wx.fillStyle = g; wx.fillRect(a0, facing > 0 ? 0 : -wL, a1 - a0, wL);
        wx.fillStyle = 'rgba(0,0,0,' + (0.5 * a) + ')'; wx.fillRect(a0, -0.6, a1 - a0, 1.2);
      }
      wx.restore();
      run += sl;
    }
  }
  function paintCrease(c) { for (const L of c) paintLine(L); }
  // bring the crease canvas in line with the crease list: paint new ones, or rewind to a checkpoint and repaint
  function syncCreases() {
    if (drawn > creases.length) {
      const c = Math.floor(creases.length / CHECK);
      checkpoints.length = Math.min(checkpoints.length, c + 1);
      if (c > 0 && checkpoints[c]) {
        wx.globalCompositeOperation = 'copy'; wx.drawImage(checkpoints[c], 0, 0); wx.globalCompositeOperation = 'source-over';
        drawn = c * CHECK;
      } else { blank(); drawn = 0; checkpoints.length = 0; }
    }
    while (drawn < creases.length) {
      paintCrease(creases[drawn]); drawn++;
      if (drawn % CHECK === 0 && !checkpoints[drawn / CHECK]) {
        const cp = document.createElement('canvas'); cp.width = WW; cp.height = WH;
        cp.getContext('2d').drawImage(wc, 0, 0); checkpoints[drawn / CHECK] = cp;
      }
    }
  }
  // one swipe step at poster point (u, v), moving by (du, dv) in poster widths/heights.
  // Any direction crumples; a new crease event comes every so often (a random distance, so no steady rhythm).
  // Only the 抚平 button flattens the sheet again.
  let travel = 0, nextAt = 10;
  function rub(u, v, du, dv) {
    const dx = du * WW, dy = dv * WH, step = Math.hypot(dx, dy);
    if (!step) return;
    travel += step;
    const dir = Math.atan2(dy, dx);
    while (travel > nextAt && creases.length < MAX_CREASES) {
      travel -= nextAt;
      creases.push(makeCrease(u, v, dir, creases.length));
      nextAt = 6 - Math.log(1 - Math.random() * 0.98) * 16;     // random spacing, about 22 px on average
    }
    if (creases.length >= MAX_CREASES) travel = 0;
  }
  function drawCrumple(W, H) {
    syncCreases();
    if (!creases.length) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(PAPER.l * W, PAPER.t * H, (PAPER.r - PAPER.l) * W, (PAPER.b - PAPER.t) * H); ctx.clip();
